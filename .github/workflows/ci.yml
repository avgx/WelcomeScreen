name: CI

on:
  push:
    branches:
      - main
      - dev

  pull_request:
    branches:
      - main
      - dev

  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: macos-15

    strategy:
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.3"

      - name: Xcode version
        run: xcodebuild -version
        
      - name: Xcode sdks
        run: xcodebuild -showsdks
        
      - name: Show destinations
        run:  xcodebuild  -scheme WelcomeScreen  -showdestinations

      - name: Validate Package.swift
        run: swift package dump-package > /dev/null

      - run: xcrun simctl list devices available

      - name: Resolve package dependencies
        run: xcodebuild -resolvePackageDependencies

      - name: Boot simulator
        run: xcrun simctl boot "iPhone 16" || true

      - name: Boot tvOS simulator
        run: xcrun simctl boot "Apple TV" || true

      - name: Build iOS
        run:     xcodebuild -scheme WelcomeScreen -destination "platform=iOS Simulator,name=iPhone 16" -configuration Debug build CODE_SIGNING_ALLOWED=NO

      - name: Build tvOS
        run:     xcodebuild -scheme WelcomeScreen -destination "platform=tvOS Simulator,name=Apple TV" -configuration Debug build CODE_SIGNING_ALLOWED=NO

      - name: Build macOS
        run:     xcodebuild -scheme WelcomeScreen -destination "generic/platform=macOS" build CODE_SIGNING_ALLOWED=NO

