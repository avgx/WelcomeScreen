name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  verify-and-release:
    name: Verify (${{ matrix.platform.name }})
    runs-on: macos-15

    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: iOS
            sdk: iphoneos

          - name: tvOS
            sdk: appletvos

          - name: macOS
            sdk: macosx

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.3"

      - name: Xcode version
        run: xcodebuild -version

      - name: Validate Package.swift
        run: |
          swift package dump-package > /dev/null

      - name: Resolve package dependencies
        run: |
          xcodebuild -resolvePackageDependencies

      - name: Build Release Configuration
        run: |
          xcodebuild \
            -scheme WelcomeScreen \
            -sdk "${{ matrix.platform.sdk }}" \
            -configuration Release \
            build \
            CODE_SIGNING_ALLOWED=NO

      - name: Archive Package Sources
        if: matrix.platform.name == 'iOS'
        run: |
          zip -r WelcomeScreen-${{ github.ref_name }}.zip \
            Package.swift \
            Sources \
            LICENSE \
            README.md

      - name: Create GitHub Release
        if: matrix.platform.name == 'iOS'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            WelcomeScreen-${{ github.ref_name }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}